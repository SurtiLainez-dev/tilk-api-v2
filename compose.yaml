
services:
  tilk-api-v2:
    build:
      context: .
      dockerfile: Dockerfile
      target: development

    container_name: tilk-api-v2

    restart: unless-stopped

    init: true

    ports:
      - "127.0.0.1:3001:3001"

    env_file:
      - .env

    environment:
      NODE_ENV: development
      PORT: 3001
      CHOKIDAR_USEPOLLING: "true"

    volumes:
      - .:/app
      - tilk_node_modules:/app/node_modules

    command: npm run start:dev

    mem_limit: 1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tilk_node_modules:
