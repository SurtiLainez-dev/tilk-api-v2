
services:
  tilk-api-v2:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    container_name: tilk-api-v2

    restart: unless-stopped

    init: true

    ports:
      - "127.0.0.1:3100:3001"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3001

    mem_limit: 1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      - ./certs/ca-certificate.crt:/app/certs/ca-certificate.crt:ro